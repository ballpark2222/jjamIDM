<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jjamIDM 설정</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; border-bottom: 2px solid #1565c0; padding-bottom: 8px; }
  h2 { font-size: 14px; margin: 20px 0 6px; color: #1565c0; }
  label { display: block; margin: 8px 0; font-size: 13px; }
  input[type=text], input[type=number], textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    border: 1px solid #bbb; border-radius: 4px; font-size: 13px;
  }
  textarea { height: 70px; font-family: Consolas, monospace; }
  .hint { font-size: 11px; color: #777; margin: 2px 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type=number] { width: 80px; }
  button { padding: 8px 20px; background: #1565c0; color: #fff; border: 0;
           border-radius: 4px; font-size: 13px; cursor: pointer; }
  #saved { color: #2e7d32; font-size: 12px; margin-left: 10px; }
  /* ---- history ---- */
  #hist { max-height: 320px; overflow-y: auto; border: 1px solid #ddd;
          border-radius: 4px; }
  .hrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
          border-bottom: 1px solid #eee; font-size: 12px; }
  .hrow:last-child { border-bottom: 0; }
  .hdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hdot.ok { background: #2e7d32; } .hdot.err { background: #c62828; }
  .hdot.run { background: #1565c0; } .hdot.etc { background: #999; }
  .hname { flex: 1; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .hmeta { color: #888; flex: none; font-size: 11px; }
  .hbtn { padding: 2px 8px; font-size: 11px; background: #eee;
          color: #333; border-radius: 3px; }
  .hbtn:hover { background: #ddd; }
  #histEmpty { padding: 16px; color: #999; text-align: center;
               font-size: 12px; }
  #clearHist { background: #eee; color: #555; padding: 4px 12px;
               font-size: 12px; }
  #clearHist:hover { background: #e0e0e0; }
</style>
</head>
<body>
<h1>jjamIDM 설정</h1>

<h2>다운로드</h2>
<div class="row">
  <label style="margin:0">연결 수(분할):</label>
  <input id="maxConnections" type="number" min="1" max="16">
</div>
<div class="hint">파일 하나를 나눠 받는 동시 연결 수 (1–16)</div>
<label><input id="askBeforeDownload" type="checkbox"> 다운로드 시작 전 확인 창 표시</label>
<label><input id="notifications" type="checkbox"> 알림 표시 (시작/완료/실패)</label>
<label><input id="floatingButton" type="checkbox"> 영상 위에 다운로드 버튼 표시</label>

<h2>파일 타입별 폴더</h2>
<textarea id="typeFolders" placeholder="mp4,mkv,avi=비디오&#10;mp3,flac=음악&#10;pdf,docx=문서"></textarea>
<div class="hint">한 줄에 <code>확장자들=폴더명</code>. 다운로드 폴더 아래에 서브폴더로 저장됩니다.</div>

<h2>자동 가로채기 필터</h2>
<input id="captureFilter" type="text" placeholder="비우면 모든 다운로드 가로챔 — 예: zip,exe,mp4,pdf">
<div class="hint">이 확장자만 가로챕니다 (쉼표 구분)</div>
<input id="excludeFilter" type="text" placeholder="가로채지 않을 확장자 — 예: exe,msi">
<div class="hint">이 확장자는 항상 브라우저가 받습니다</div>

<p><button id="save">저장</button><span id="saved"></span></p>

<h2>다운로드 기록</h2>
<div id="hist"><div id="histEmpty">기록 없음</div></div>
<p style="margin-top:8px"><button id="clearHist">기록 지우기</button></p>
<script src="options.js"></script>
</body>
</html>
