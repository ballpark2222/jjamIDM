<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jjamIDM 영상 다운로드</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 16px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 12px; color: #1565c0; }
  .url { font-size: 11px; color: #666; word-break: break-all; max-height: 3em;
         overflow: hidden; margin-bottom: 12px; }
  label { display: block; font-size: 12px; margin: 10px 0 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px;
    border: 1px solid #bbb; border-radius: 4px; font-size: 13px; }
  #formats { max-height: 220px; overflow-y: auto; border: 1px solid #ddd;
    border-radius: 4px; }
  #formats label.fmt { display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; margin: 0; font-size: 13px; cursor: pointer;
    border-bottom: 1px solid #f0f0f0; }
  #formats label.fmt:hover { background: #eef4fb; }
  #formats label.fmt:last-child { border-bottom: 0; }
  #formats .q { font-weight: 600; min-width: 76px; }
  #formats .meta { color: #777; font-size: 11px; }
  #probe-status { padding: 14px 10px; font-size: 12px; color: #666; }
  #subs label { display: inline-block; margin: 0 12px 0 0; font-size: 12px;
    cursor: pointer; }
  .btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  button { padding: 7px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;
           border: 1px solid #bbb; background: #f5f5f5; }
  button.primary { background: #1565c0; color: #fff; border: 0; }
  button:disabled { opacity: .5; cursor: default; }
  #err { color: #c62828; font-size: 12px; min-height: 1em; margin-top: 8px; }
</style>
</head>
<body>
<h1>영상 다운로드</h1>
<div class="url" id="url"></div>
<label>파일 이름</label>
<input id="filename" type="text">
<label>화질</label>
<div id="formats"><div id="probe-status">형식 확인 중…</div></div>
<div id="subs-wrap" style="display:none">
  <label>자막</label>
  <div id="subs"></div>
</div>
<div id="err"></div>
<div class="btns">
  <button id="now" class="primary" disabled>지금 받기</button>
  <button id="cancel">취소</button>
</div>
<script src="media_dialog.js"></script>
</body>
</html>
