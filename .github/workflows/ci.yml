name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  dart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: bash tools/test_all.sh

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: browser/extension
        run: |
          npm ci
          npm run build
        if: hashFiles('browser/extension/package.json') != ''

  native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: apps/native-host
        run: |
          cargo build --locked
          cargo test
        if: hashFiles('apps/native-host/Cargo.toml') != ''
